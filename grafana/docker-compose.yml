services:
  grafana:
    image: grafana/grafana:13.0
    container_name: devpulse-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: debug
      DEVPULSE_DB_HOST: ${DEVPULSE_DB_HOST}
      DEVPULSE_DB_PORT: ${DEVPULSE_DB_PORT:-5432}
      DEVPULSE_DB_NAME: ${DEVPULSE_DB_NAME}
      DEVPULSE_DB_USER: ${DEVPULSE_DB_USER}
      DEVPULSE_DB_PASSWORD: ${DEVPULSE_DB_PASSWORD}
      DEVPULSE_DB_SSLMODE: ${DEVPULSE_DB_SSLMODE:-disable}
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-data:

