# Base compose file for DevPulse local backends.
#
# This file on its own brings up nothing — pick a backend overlay and
# compose them with `-f`:
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml    up -d
#
# Multiple overlays can be combined, e.g. to run Postgres and Metabase
# side-by-side so you can browse metrics against the freshly-synced
# data:
#
#   docker compose -f docker-compose.yml \
#       -f docker-compose.postgres.yml \
#       -f docker-compose.metabase.yml up -d
services: {}

networks:
  devpulse:

volumes:
  postgres-data:
  mysql-data:
  metabase-data:
