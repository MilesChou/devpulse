services:
  mysql:
    image: mysql:8.4
    container_name: devpulse-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: devpulse
      MYSQL_USER: devpulse
      MYSQL_PASSWORD: devpulse
      MYSQL_ROOT_PASSWORD: devpulse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "devpulse", "-pdevpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    container_name: devpulse-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: debug
      DEVPULSE_DB_HOST: mysql
      DEVPULSE_DB_PORT: ${DB_PORT:-3306}
      DEVPULSE_DB_NAME: ${DB_DATABASE}
      DEVPULSE_DB_USER: ${DB_USERNAME}
      DEVPULSE_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - .docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - .docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  grafana-data:
