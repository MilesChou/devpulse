services:
  postgres:
    image: postgres:17-alpine
    container_name: devpulse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: devpulse
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: devpulse
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpulse -d devpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    container_name: devpulse-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: debug
      DEVPULSE_DB_HOST: postgres
      DEVPULSE_DB_PORT: ${DB_PORT:-5432}
      DEVPULSE_DB_NAME: ${DB_DATABASE}
      DEVPULSE_DB_USER: ${DB_USERNAME}
      DEVPULSE_DB_PASSWORD: ${DB_PASSWORD}
      DEVPULSE_DB_SSLMODE: ${DEVPULSE_DB_SSLMODE:-disable}
    volumes:
      - .docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - .docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  grafana-data:
