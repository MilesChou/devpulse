apiVersion: 1

datasources:
  - name: devpulse
    type: mysql
    access: proxy
    uid: devpulse
    url: ${DEVPULSE_DB_HOST}:${DEVPULSE_DB_PORT}
    user: ${DEVPULSE_DB_USER}
    database: ${DEVPULSE_DB_NAME}
    isDefault: true
    jsonData:
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    secureJsonData:
      password: ${DEVPULSE_DB_PASSWORD}
    editable: true
