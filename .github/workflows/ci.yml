name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  # 強制 JS actions 走 Node 24（Node 20 deprecation warning 修補）
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=-1

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Cache PHPCS / PHPStan results
        uses: actions/cache@v4
        with:
          path: |
            .cache/phpcs
            .phpstan.result.cache
          key: ${{ runner.os }}-lint-${{ matrix.php }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lint-${{ matrix.php }}-

      - name: Run PHPCS (parallel + cache)
        run: |
          mkdir -p .cache/phpcs
          vendor/bin/phpcs --parallel=$(nproc) --cache=.cache/phpcs/.phpcs.cache

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run PHPUnit (parallel)
        run: php artisan test --parallel --without-databases --processes=$(nproc) --no-coverage
