name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "Files need gofmt:" >&2
            echo "$diff" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.dialect }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres, mysql]
        include:
          - dialect: sqlite
            dsn: "memory"
          - dialect: postgres
            dsn: "postgres://devpulse:devpulse@localhost:5432/devpulse?sslmode=disable"
          - dialect: mysql
            dsn: "mysql://devpulse:devpulse@(localhost:3306)/devpulse?parseTime=true&multiStatements=true"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devpulse
          POSTGRES_USER: devpulse
          POSTGRES_PASSWORD: devpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devpulse -d devpulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: devpulse
          MYSQL_USER: devpulse
          MYSQL_PASSWORD: devpulse
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -udevpulse -pdevpulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Remote DSNs share one DB across every test. -p 1 keeps tests
      # serial so each can roll migrations down + back up cleanly.
      - name: go test
        env:
          DEVPULSE_DSN: ${{ matrix.dsn }}
        run: |
          if [ "${{ matrix.dialect }}" = "sqlite" ]; then
            go test -race -count=1 -timeout=10m ./...
          else
            go test -p 1 -race -count=1 -timeout=10m ./...
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: devpulse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
