name: Docker Build

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  # 強制 JS actions 走 Node 24（Node 20 deprecation warning 修補）
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    # workflow_run 觸發時，CI 必須成功才繼續（手動觸發則無此檢查）
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run 預設 checkout default branch tip；改抓觸發 CI 的 commit
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: devpulse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
