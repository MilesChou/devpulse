[package]
name = "devpulse-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Desktop dashboard for the DevPulse HTTP API"
publish = false

[[bin]]
name = "devpulse-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "7"
eframe = "0.36"
egui_plot = "0.37"
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = "thin"
